schema {
  query: RootQueryType
  mutation: RootMutationType
}

type Author implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  name: String!
  updatedAt: DateTime!
}

type AuthorPerson implements Node {
  author: Author!
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  person: Person!
  updatedAt: DateTime!
}

type Book implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  published: Date!
  publishedFormat: DateFormat!
  title: String!
  updatedAt: DateTime!
}

type BookAuthor implements Node {
  author: Author!
  book: Book!
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  position: Int!
  updatedAt: DateTime!
}

type BookUniverse implements Node {
  book: Book!
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  universe: Universe!
  updatedAt: DateTime!
}

type Chapter {
  endTime: Float
  id: ID!
  startTime: Float!
  title: String
}

input CreateSessionInput {
  email: String!
  password: String!
}

type CreateSessionPayload {
  token: String!
  user: User!
}

"""
The `Date` scalar type represents a date. The Date appears in a JSON
response as an ISO8601 formatted string, without a time component.
"""
scalar Date

enum DateFormat {
  FULL
  YEAR
  YEAR_MONTH
}

"""
The `DateTime` scalar type represents a date and time in the UTC
timezone. The DateTime appears in a JSON response as an ISO8601 formatted
string, including UTC timezone ("Z"). The parsed date and time string will
be converted to UTC if there is an offset.
"""
scalar DateTime

"""
The `Decimal` scalar type represents signed double-precision fractional
values parsed by the `Decimal` library. The Decimal appears in a JSON
response as a string to preserve precision.
"""
scalar Decimal

type DeleteSessionPayload {
  deleted: Boolean!
}

type Deletion implements Node {
  deletedAt: DateTime!
  """The ID of an object"""
  id: ID!
  recordId: ID!
  type: DeletionType!
}

enum DeletionType {
  AUTHOR
  AUTHOR_PERSON
  BOOK
  BOOK_AUTHOR
  BOOK_UNIVERSE
  MEDIA
  MEDIA_NARRATOR
  MEDIA_TRACK
  NARRATOR
  PERSON
  RECORDING_GROUP
  SERIES
  SERIES_BOOK
  UNIVERSE
}

input DeviceInput {
  appBuild: String
  appId: String
  appVersion: String
  brand: String
  browser: String
  browserVersion: String
  id: ID!
  modelName: String
  osName: String
  osVersion: String
  type: DeviceTypeInput!
}

enum DeviceTypeInput {
  ANDROID
  IOS
}

type Media implements Node {
  abridged: Boolean!
  book: Book!
  chapters: [Chapter!]!
  description: String
  duration: Float
  fullCast: Boolean!
  hlsPath: String
  """The ID of an object"""
  id: ID!
  imagePath: String @deprecated(reason: "use `thumbnails` instead")
  insertedAt: DateTime!
  mp4Path: String
  mpdPath: String
  notes: String
  """
  For multi-part recordings: this recording's position in its part set; the set's total lives on the recording group
  """
  partNumber: Int
  published: Date
  publishedFormat: DateFormat!
  publisher: String
  recordingGroup: RecordingGroup
  status: MediaProcessingStatus!
  supplementalFiles: [SupplementalFile!]!
  thumbnails: Thumbnails
  """
  Display-title override for this recording (translated/regional/retail title); null means the book's title applies
  """
  title: String
  updatedAt: DateTime!
}

type MediaNarrator implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  media: Media!
  narrator: Narrator!
  position: Int!
  updatedAt: DateTime!
}

enum MediaProcessingStatus {
  ERROR
  PENDING
  PROCESSING
  READY
}

"""One audio file of a recording, played directly by the client"""
type MediaTrack implements Node {
  """
  Audio codec as probed, e.g. "aac". Clients decide playability from this and `mime` — nothing here is assumed playable
  """
  codec: String
  duration: Float!
  """
  Container as probed, e.g. "mov,mp4,m4a,3gp,3g2,mj2"
  """
  format: String
  """The ID of an object"""
  id: ID!
  """Position in the recording's ordered track list, 0-based"""
  index: Int!
  insertedAt: DateTime!
  media: Media!
  """
  Media type of the file, e.g. "audio/mp4"
  """
  mime: String
  """
  Where to fetch the file; requires the same authentication as any other media URL
  """
  path: String!
  seekAccuracy: SeekAccuracy!
  """
  Size in bytes. A float because audiobook files routinely exceed what GraphQL's 32-bit Int can hold
  """
  size: Float!
  """
  Where this track starts on the book's continuous timeline, in seconds. Playback positions are always absolute book-seconds
  """
  startOffset: Float!
  updatedAt: DateTime!
}

type Narrator implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  name: String!
  person: Person!
  updatedAt: DateTime!
}

interface Node {
  """The ID of the object."""
  id: ID!
}

type Person implements Node {
  description: String
  """The ID of an object"""
  id: ID!
  imagePath: String @deprecated(reason: "use `thumbnails` instead")
  insertedAt: DateTime!
  name: String!
  thumbnails: Thumbnails
  updatedAt: DateTime!
}

type PlaybackEvent {
  deviceId: ID
  fromPosition: Float
  id: ID!
  mediaId: ID
  playbackRate: Float
  playthroughId: ID!
  position: Float
  previousRate: Float
  timestamp: DateTime!
  toPosition: Float
  type: PlaybackEventType!
}

input PlaybackEventInput {
  fromPosition: Float
  id: ID!
  mediaId: ID
  playbackRate: Float
  playthroughId: ID!
  position: Float
  previousRate: Float
  timestamp: DateTime!
  toPosition: Float
  type: PlaybackEventType!
}

enum PlaybackEventType {
  ABANDON
  DELETE
  FINISH
  PAUSE
  PLAY
  RATE_CHANGE
  RESUME
  SEEK
  START
}

type RecordingGroup implements Node {
  """The work this set covers, same as its members'"""
  book: Book!
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  """This set's name, shown to readers only when `show_label` says so"""
  name: String!
  """
  Wording for one release in this set; null means "part"
  """
  partWord: String
  """
  Wording for several releases; null means "parts"
  """
  partWordPlural: String
  """How many releases the set has, when known ("Part 2 of 3")"""
  partsTotal: Int
  """
  Whether to show `name` on this set's tile; an operator choice, never inferred
  """
  showLabel: Boolean!
  updatedAt: DateTime!
}

type RootMutationType {
  createSession(input: CreateSessionInput!): CreateSessionPayload
  deleteSession: DeleteSessionPayload
  """
  V2 sync: events only, no playthroughs. All state is derived from events.
  """
  syncEvents(input: SyncEventsInput!): SyncEventsPayload
}

type RootQueryType {
  authorPeopleChangedSince(since: DateTime): [AuthorPerson!]!
  authorsChangedSince(since: DateTime): [Author!]!
  bookAuthorsChangedSince(since: DateTime): [BookAuthor!]!
  bookUniversesChangedSince(since: DateTime): [BookUniverse!]!
  booksChangedSince(since: DateTime): [Book!]!
  deletionsSince(since: DateTime): [Deletion!]!
  me: User
  mediaChangedSince(since: DateTime): [Media!]!
  mediaNarratorsChangedSince(since: DateTime): [MediaNarrator!]!
  mediaTracksChangedSince(since: DateTime): [MediaTrack!]!
  narratorsChangedSince(since: DateTime): [Narrator!]!
  peopleChangedSince(since: DateTime): [Person!]!
  recordingGroupsChangedSince(since: DateTime): [RecordingGroup!]!
  seriesBooksChangedSince(since: DateTime): [SeriesBook!]!
  seriesChangedSince(since: DateTime): [Series!]!
  serverTime: DateTime!
  universesChangedSince(since: DateTime): [Universe!]!
}

"""How accurately a player can seek within a track"""
enum SeekAccuracy {
  """
  The file carries no seek index (e.g. VBR mp3 with no Xing header); positions may drift
  """
  APPROXIMATE
  """Seeking lands where it says it does"""
  EXACT
}

type Series implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  name: String!
  updatedAt: DateTime!
}

type SeriesBook implements Node {
  book: Book!
  bookNumber: Decimal!
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  position: Int!
  series: Series!
  updatedAt: DateTime!
}

type SupplementalFile {
  filename: String!
  label: String
  mime: String!
  path: String!
}

input SyncEventsInput {
  device: DeviceInput!
  events: [PlaybackEventInput!]!
  lastSyncTime: DateTime
}

type SyncEventsPayload {
  events: [PlaybackEvent!]!
  serverTime: DateTime!
}

type Thumbnails {
  blurhash: String
  extraLarge: String!
  extraSmall: String!
  large: String!
  medium: String!
  small: String!
  thumbhash: String!
}

type Universe implements Node {
  """The ID of an object"""
  id: ID!
  insertedAt: DateTime!
  name: String!
  updatedAt: DateTime!
}

type User {
  admin: Boolean!
  confirmedAt: DateTime
  email: String!
  insertedAt: DateTime!
  updatedAt: DateTime!
}